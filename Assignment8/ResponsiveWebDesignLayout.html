<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Web Design Layout</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #333;
    color: #fff;
    padding: 15px 30px;
  }

  nav a {
    color: #fff;
    text-decoration: none;
    margin: 0 10px;
  }

  main {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    padding: 40px;
    background: #f4f4f4;
  }

  .feature {
    background: white;
    border-radius: 10px;
    padding: 20px;
    width: 30%;
    min-width: 250px;
    text-align: center;
    transition: transform 0.3s ease;
  }

  .feature:hover {
    transform: scale(1.05);
  }

  footer {
    text-align: center;
    padding: 20px;
    background: #222;
    color: #fff;
  }

  @media (max-width: 750px) {
    .feature {
      width: 100%;
      margin-bottom: 20px;
    }
  }
</style>
</head>
<body>
  <header>
    <div class="logo">MyLogo</div>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <div class="feature">Feature 1</div>
    <div class="feature">Feature 2</div>
    <div class="feature">Feature 3</div>
  </main>

  <footer>&copy; 2025 My Website</footer>
</body>
</html>
