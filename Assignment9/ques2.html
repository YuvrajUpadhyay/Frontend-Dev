<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
    }
    .profile-img {
      width: 150px;
    }
  </style>
</head>
<body class="bg-light text-dark">
  <header class="container text-center mt-4">
    <h1 class="fw-bold">Yuvraj Upadhyay</h1>
    <p class="lead">Aspiring Developer & ML Enthusiast</p>
  </header>

  <main class="container text-center mt-4">
    <img src="profile.jpg" alt="Profile" class="img-fluid rounded-circle profile-img mb-3">
    <div class="mb-3">
      <a href="#" class="btn btn-primary me-2">Hire Me</a>
      <a href="#" class="btn btn-outline-secondary">Download CV</a>
    </div>
    <form class="mt-4">
      <input type="text" class="form-control mb-2" placeholder="Your Name">
      <input type="email" class="form-control mb-2" placeholder="Your Email">
      <textarea class="form-control mb-2" rows="3" placeholder="Message"></textarea>
      <button type="submit" class="btn btn-success">Send</button>
    </form>
  </main>

  <footer class="text-center p-3 mt-5">
    <p>&copy; 2025 Yuvraj Upadhyay</p>
  </footer>
</body>
</html>
