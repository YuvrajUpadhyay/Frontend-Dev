<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Today's Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    .menu-img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <main class="container my-5">
    <section class="text-center mb-4">
      <h2 class="lead">Chef's Specials</h2>
      <ul class="list-group">
        <li class="list-group-item">Grilled Salmon</li>
        <li class="list-group-item">Spicy Paneer Tikka</li>
        <li class="list-group-item">Chocolate Lava Cake</li>
      </ul>
    </section>

    <section class="mb-5">
      <h3 class="text-center">Menu Table</h3>
      <table class="table table-bordered text-center">
        <thead class="table-light">
          <tr>
            <th>Item</th>
            <th>Category</th>
            <th>Price</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Margherita Pizza</td>
            <td>Veg</td>
            <td>₹299</td>
          </tr>
          <tr>
            <td>Butter Chicken</td>
            <td>Non-Veg</td>
            <td>₹349</td>
          </tr>
        </tbody>
      </table>
    </section>

    <section class="text-center">
      <img src="food.jpg" alt="Delicious Dish" class="img-fluid menu-img mb-2">
      <p class="lead">Freshly prepared with love</p>
    </section>
  </main>

  <footer class="text-center p-3">
    <p>&copy; 2025 Gourmet Bites</p>
  </footer>
</body>
</html>
