<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notifications Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    .notification {
      border-left: 5px solid #0d6efd;
    }
  </style>
</head>
<body>
  <main class="container my-5">
    <section>
      <h2 class="mb-4">Recent Notifications</h2>
      <div class="list-group">
        <div class="list-group-item notification">
          <h5 class="mb-1">New Assignment Uploaded</h5>
          <p class="mb-1">Bootstrap Assignment 10 is now available.</p>
          <small>2 hours ago</small>
        </div>
        <div class="list-group-item notification">
          <h5 class="mb-1">Class Rescheduled</h5>
          <p class="mb-1">Tomorrow's lecture moved to 11 AM.</p>
          <small>5 hours ago</small>
        </div>
      </div>
    </section>
  </main>

  <footer class="text-center p-3">
    <p>&copy; 2025 GLA University</p>
  </footer>
</body>
</html>
