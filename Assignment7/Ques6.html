<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CSS Animation Demonstration</title>
        <style>
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
                height: 100vh;
                background: #f3f4f6;
                font-family: Arial, sans-serif;
                gap: 40px;
            }

            .move-box {
                width: 100px;
                height: 100px;
                background: #2563eb;
                animation: moveRight 3s ease-in-out infinite alternate;
            }
        
            @keyframes moveRight {
                from { transform: translateX(0); }
                to { transform: translateX(200px); }
            }
        
            .ball {
                width: 60px;
                height: 60px;
                background: #ef4444;
                border-radius: 50%;
                animation: bounce 1.5s ease-in-out infinite;
            }
        
            @keyframes bounce {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-120px); }
            }
        
            .color-text {
                font-size: 2rem;
                font-weight: bold;
                animation: colorChange 4s ease-in-out infinite alternate;
            }
        
            @keyframes colorChange {
                0% { color: #2563eb; }
                50% { color: #f59e0b; }
                100% { color: #10b981; }
            }
        </style>
    </head>
    <body>
        <div class="move-box"></div>
        <div class="ball"></div>
        <div class="color-text">Color Changing Text</div>
    </body>
</html>
