<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mini UI Layout</title>
        <style>
            * {
                box-sizing: border-box;
            }
          
            body {
                margin: 0;
                font-family: Arial, sans-serif;
                background: #f9fafb;
                display: flex;
                flex-direction: column;
                min-height: 100vh;
            }
          
            header, footer {
                background: #2563eb;
                color: white;
                text-align: center;
                padding: 15px;
            }
          
            main {
                flex: 1;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 40px;
            }
          
            .card {
                background: white;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.1);
                max-width: 400px;
                width: 100%;
                text-align: center;
            }
          
            .card img {
                width: 100px;
                border-radius: 50%;
                margin-bottom: 20px;
            }
          
            input, button {
                width: 100%;
                padding: 10px;
                margin: 10px 0;
                border-radius: 8px;
                border: 1px solid #d1d5db;
                transition: all 0.3s ease;
            }
          
            input:focus {
                outline: 2px solid #2563eb;
            }
          
            button {
                background: #2563eb;
                color: white;
                border: none;
                cursor: pointer;
            }
          
            button:hover {
                background: #1d4ed8;
            }
        </style>
    </head>
    <body>
        <header>Mini UI Layout</header>
        <main>
            <div class="card">
                <img src="https://picsum.photos/100" alt="Profile">
                <input type="text" placeholder="Enter your name">
                <input type="email" placeholder="Enter your email">
                <button>Submit</button>
            </div>
        </main>
      <footer>© 2025 Mini UI Demo | Built with CSS</footer>
    </body>
</html>
