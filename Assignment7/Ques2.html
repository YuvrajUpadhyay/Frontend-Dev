<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tooltip Demonstration</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                display: flex;
                    justify-content: center;
                align-items: center;
                height: 100vh;
                background: #f3f4f6;
            }

            .container {
                display: flex;
                gap: 40px;
            }

            .tooltip {
                position: relative;
                display: inline-block;
                cursor: pointer;
                font-size: 2rem;
            }

            .tooltip::after {
                content: attr(data-tip);
                position: absolute;
                bottom: 120%;
                left: 50%;
                transform: translateX(-50%);
                background: black;
                color: white;
                padding: 5px 10px;
                border-radius: 5px;
                opacity: 0;
                white-space: nowrap;
                transition: opacity 0.3s ease-in-out;
                pointer-events: none;
            }

            .tooltip:hover::after {
                opacity: 1;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="tooltip" data-tip="This is a Home icon 🏠">🏠</div>
            <div class="tooltip" data-tip="Click here to Search 🔍">🔍</div>
            <div class="tooltip" data-tip="This is your Profile 👤">👤</div>
        </div>
    </body>
</html>
