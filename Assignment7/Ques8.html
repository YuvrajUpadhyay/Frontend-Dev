<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Box-Sizing Comparison</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background: #f9fafb;
                display: flex;
                justify-content: center;
                align-items: center;
                flex-direction: column;
                height: 100vh;
                gap: 20px;
            }
          
            .container {
                display: flex;
                gap: 40px;
                flex-wrap: wrap;
            }
          
            .box {
                width: 200px;
                padding: 20px;
                border: 5px solid #000;
                background: #93c5fd;
                color: #111;
            }
          
            .border-box {
                box-sizing: border-box;
                background: #fca5a5;
            }
          
            p {
                max-width: 500px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="box">Default (content-box)</div>
            <div class="box border-box">Border-box</div>
        </div>
        <p>
            The <strong>content-box</strong> adds padding and border *outside* the width.  
            The <strong>border-box</strong> keeps total width fixed, including border & padding.
        </p>
    </body>
</html>
