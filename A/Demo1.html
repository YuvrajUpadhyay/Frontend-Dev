<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="Demo.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body class="bg-light">
   <div class="container text py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-6">
      <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class ="text-center mb-4">Create an Account</h3>
             <form action="">
              <div class="mb-3">
               <label for="name" class="form-label">Full Name</label>
               <input type="text" class="form-control" id="name" placeholder="Enter your Name">
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com">
              </div>
              <div class="mb-3">
      
               <label for="phone" class="form-label">Phone Number</label>
               <input type="tel" class="form-control" id="phone" placeholder="Enter Your Phone Number">
               </div>
              <div class="mb-3">
                <label class=""form-label d-block>Gender</label>
               <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" id="male" value="male" required>
                <label class="form-check-label" for="male">
                Male
                </label>
               </div>
               <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="gender" id="female" value="female" checked>
                <label class="form-check-label" for="female">
                Female
                </label>
               </div>
              </div>
              <div class="mb-3">
                <label for="country" class="form-label">Country</label>
                <select class="form-select" id="country" required>
                  <option value="" select disabled>Choose ...</option>
                  <option value="india">India</option>
                  <option value="usa">USA</option>
                  <option value="uk">United Kingdom</option>
                  <option value="canada">Canada</option>
                  <option value="australia">Australia</option>
                </select>
              </div>
              <div class="mb-3">
               <label for="password" class="form-label">Password</label>
               <input type="text" class="form-control" id="password" placeholder="Enter your password" required>
              </div>
              <div class="mb-3">
               <label for="confirmPassword" class="form-label">Confirm Password</label>
               <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter your password" required>
              </div>
              <div class="form-check mb-3">
  <input class="form-check-input" type="checkbox" value="" id="terms" required>
  <label class="form-check-label" for="terms"> I agree to the <a href="#" class = "text-decoration-none">Terms & Conditions</a>
  </label>
</div>
<div class="d-grid">
<button type="submit" class="btn btn-primary" onclick="getData()">Register</button></div>
<p class="text-center mt-3 mb-0">Already have an account?
    <a href="/SignIn.html" class="text-decoration-none">Login here</a>
</p>
             </form>
        </div>
      </div>
    </div>
  </div>
   </div>
</body>
</html>
