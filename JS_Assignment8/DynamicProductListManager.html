<!DOCTYPE html>
<html>
<head>
    <title>Product List Manager</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        li { margin: 8px 0; }
        button { margin-left: 10px; }
        input.edit-input {
            padding: 5px;
            font-size: 14px;
            width: 200px;
        }
    </style>
</head>
<body>

    <h2>Product List Manager</h2>
    <input type="text" id="productInput" placeholder="Enter product name">
    <button id="addBtn">Add Product</button>
    <ul id="productList"></ul>

    <script>
        const productInput = document.getElementById("productInput");
        const addBtn = document.getElementById("addBtn");
        const productList = document.getElementById("productList");
        
        let currentEdit = null; 
        
        addBtn.addEventListener("click", () => {
            const name = productInput.value.trim();
            if (name === "") return;
        
            addProductToList(name);
            productInput.value = "";
        });

        function addProductToList(name) {
            const li = document.createElement("li");
            li.innerHTML = `
                <span class="name">${name}</span>
                <button class="edit">Edit</button>
                <button class="delete">Delete</button>
            `;
            productList.appendChild(li);
        }

        productList.addEventListener("click", (event) => {
            const li = event.target.closest("li");
        
            if (event.target.classList.contains("delete")) {
                li.remove();
            }
        
            if (event.target.classList.contains("edit")) {
                enterEditMode(li);
            }
        });

        function enterEditMode(li) {
            if (currentEdit && currentEdit !== li) {
                saveEdit(currentEdit);
            }
        
            currentEdit = li;
        
            const nameSpan = li.querySelector(".name");
            const oldValue = nameSpan.textContent;
        
            nameSpan.innerHTML = `<input class="edit-input" value="${oldValue}">`;
        
            const input = li.querySelector("input");
            input.focus();
        }

        function saveEdit(li) {
            const input = li.querySelector("input");
            if (!input) return;
        
            const newValue = input.value.trim();
            li.querySelector(".name").textContent = newValue || "Unnamed Product";
        
            currentEdit = null;
        }

        document.addEventListener("click", (event) => {
            if (currentEdit && !currentEdit.contains(event.target)) {
                saveEdit(currentEdit);
            }
        });
    </script>
</body>
</html>
