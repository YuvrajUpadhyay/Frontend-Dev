<!DOCTYPE html>
<html>
<head>
  <title>Frameset Layout</title>
</head>
<body>
    <frameset rows="20%,80%">
    
    <!-- Top frame: Navigation links -->
    <frame 
        src="navigation.html" 
        name="topFrame" 
        title="Navigation Links">
    
    <!-- Bottom frame: Welcome message -->
    <frame 
        src="welcome.html" 
        name="bottomFrame" 
        title="Welcome Message">

    </frameset>
</body>
</html>
