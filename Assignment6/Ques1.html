<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borders and Padding Demonstration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .box {
      width: 150px;
      height: 150px;
      background-color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      transition: border-color 0.4s ease;
    }

    .solid {
      border: 4px solid #007bff;
      padding: 10px;
    }

    .dashed {
      border: 4px dashed #28a745;
      padding: 20px;
    }

    .double {
      border: 6px double #ff5733;
      padding: 15px;
    }

    .groove {
      border: 6px groove #6f42c1;
      padding: 25px;
    }

    .rounded {
      border-radius: 15px;
      border: 4px solid #17a2b8;
      padding: 20px;
    }

    .box:hover {
      border-color: #ff4081;
      cursor: pointer;
    }

    h1 {
      text-align: center;
      width: 100%;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Borders and Padding Demonstration</h1>
    <div class="box solid">Solid</div>
    <div class="box dashed">Dashed</div>
    <div class="box double">Double</div>
    <div class="box groove">Groove</div>
    <div class="box rounded">Rounded</div>
  </div>

</body>
</html>
