<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gradient Background Webpage</title>
        <style>

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: Arial, sans-serif;
                color: white;
                line-height: 1.6;
            }

            header {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                background: #111;
                color: #fff;
                padding: 15px 0;
                text-align: center;
                font-size: 1.5rem;
                z-index: 1000;
            }

            footer {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                background: #111;
                color: #fff;
                text-align: center;
                padding: 10px 0;
                font-size: 1rem;
            }

            section {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                font-size: 2rem;
                padding: 20px;
            }

            .linear-gradient {
                background: linear-gradient(135deg, #00c6ff, #0072ff);
            }

            .radial-gradient {
                background: radial-gradient(circle at center, #ff9a9e, #fad0c4);
                background-attachment: fixed;
            }

            .spacer {
                height: 70px;
            }
        </style>
    </head>
    <body>
        <header>
            Gradient Background Webpage
        </header>
      
        <div class="spacer"></div>
      
        <section class="linear-gradient">
            <div>
                <h2>Linear Gradient Section</h2>
                <p>This section uses a linear gradient background.</p>
            </div>
        </section>
      
        <section class="radial-gradient">
            <div>
                <h2>Radial Gradient Section</h2>
                <p>This section uses a radial gradient background with a parallax effect.</p>
            </div>
        </section>
      
        <div class="spacer"></div>
      
        <footer>
            © 2025 Gradient Webpage | Created by Shiv Kumar
        </footer>
    </body>
</html>
