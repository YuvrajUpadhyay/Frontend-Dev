<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transformations Showcase</title>

  <style>
    /* ---------------------------
       BASIC PAGE STYLING
    --------------------------- */
    body {
      font-family: "Poppins", sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 40px;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.2);
    }

    /* ---------------------------
       FLEXBOX CONTAINER
    --------------------------- */
    .box-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    /* ---------------------------
       BOX STYLING
    --------------------------- */
    .box {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 1.2rem;
      transition: all 0.4s ease; /* Smooth animation */
    }

    /* ---------------------------
       TRANSFORMATION EFFECTS
    --------------------------- */
    .rotate:hover {
      transform: rotate(45deg);
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    }

    .scale:hover {
      transform: scale(1.3);
      background: linear-gradient(135deg, #a1ffce, #faffd1);
      color: #222;
    }

    .translate:hover {
      transform: translateY(-30px);
      background: linear-gradient(135deg, #84fab0, #8fd3f4);
    }

    .skew:hover {
      transform: skew(15deg, 5deg);
      background: linear-gradient(135deg, #f6d365, #fda085);
    }

    /* ---------------------------
       LABELS BELOW BOXES
    --------------------------- */
    .label {
      text-align: center;
      margin-top: 10px;
      font-size: 1rem;
      color: #444;
    }

    /* Optional styling for better layout on small screens */
    @media (max-width: 600px) {
      .box-container {
        flex-direction: column;
        gap: 25px;
      }
    }
  </style>
</head>
<body>
  <h1>CSS Transformations Showcase</h1>

  <div class="box-container">
    <div>
      <div class="box rotate">Rotate</div>
      <div class="label">rotate(45deg)</div>
    </div>

    <div>
      <div class="box scale">Scale</div>
      <div class="label">scale(1.3)</div>
    </div>

    <div>
      <div class="box translate">Translate</div>
      <div class="label">translateY(-30px)</div>
    </div>

    <div>
      <div class="box skew">Skew</div>
      <div class="label">skew(15deg, 5deg)</div>
    </div>
  </div>
</body>
</html>
