<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pricing Plans</title>
  <link rel="stylesheet" href="ques5.css">
</head>
<body>
  <section class="pricing">
    <div class="plan basic">
      <h2>Basic</h2>
      <ul>
        <li>1 Project</li>
        <li>Email Support</li>
        <li>Community Access</li>
      </ul>
      <p class="price">9rs/month</p>
      <a href="#">Choose Plan</a>
    </div>
    <div class="plan popular">
      <h2>Standard</h2>
      <ul>
        <li>5 Projects</li>
        <li>Priority Support</li>
        <li>Community Access</li>
      </ul>
      <p class="price">29rs/month</p>
      <a href="#">Choose Plan</a>
    </div>
    <div class="plan premium">
      <h2>Premium</h2>
      <ul>
        <li>Unlimited Projects</li>
        <li>24/7 Support</li>
        <li>Private Community</li>
      </ul>
      <p class="price">59rs/month</p>
      <a href="#">Choose Plan</a>
    </div>
  </section>
</body>
</html>
