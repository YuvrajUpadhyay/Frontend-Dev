<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Mastery</title>
  <link rel="stylesheet" href="ques10.css">
</head>
<body>
  <header>
    <nav>
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Services</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Welcome to My Site</h1>
  </section>

  <section class="about">
    <div class="text">I love building clean, responsive layouts.</div>
    <div class="image"><img src="a.jpg" alt="About"></div>
  </section>

  <section class="services">
    <div class="service">Design</div>
    <div class="service">Development</div>
    <div class="service">Consulting</div>
  </section>

  <section class="contact">
    <form>
      <input type="text" placeholder="Your Name">
      <input type="email" placeholder="Your Email">
      <textarea placeholder="Message"></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

  <footer>&copy; 2025 Yuvraj</footer>
</body>
</html>
